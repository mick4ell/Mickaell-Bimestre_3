<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contato</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="CSS/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Início</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarText"
          aria-controls="navbarText"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarText">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="god-1.html"
                >GOD OF WAR I</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="god-2.html">GOD OF WAR II</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="god-3.html">GOD OF WAR III</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contato.html">Contato</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <header class="hero hero-index">
      <div class="container">
        <div class="hero-label mb-3"></div>
        <h1 class="mb-4">Entre em contato</h1>
        <p class="lead">
          Tem alguma dúvida, sugestão ou quer compartilhar sua opinião sobre a
          trilogia?
        </p>
      </div>
    </header>

    <section class="section">
      <div class="container">
        <div class="row g-5">
          <div class="col-lg-7">
            <form>
              <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input
                  type="text"
                  class="form-control"
                  id="nome"
                  placeholder="Seu nome completo"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  placeholder="seuemail@exemplo.com"
                  required
                />
              </div>
              <div class="mb-4">
                <label for="mensagem" class="form-label">Mensagem</label>
                <textarea
                  class="form-control"
                  id="mensagem"
                  rows="6"
                  placeholder="Escreva sua mensagem aqui..."
                  required
                ></textarea>
              </div>
            </form>
          </div>
          <input class="btn btn-primary" type="submit" value="ENVIAR MENSAGEM">
    </section>

    <footer>
      <div class="container d-flex flex-wrap justify-content-between gap-2">
        <p>Site criado por Mickaell T. Medeiros </p>
      </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
